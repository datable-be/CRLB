[project]
name = "crlb"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.28.2",
    "rapidfuzz>=3.14.6",
]

[project.scripts]
crlb = "crlb.cli:main"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["scripts/archive"]

[tool.ty.src]
exclude = ["scripts/archive"]
