[project]
name = "crlb"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pymupdf>=1.28.2",
    "rapidfuzz>=3.14.6",
]

[project.scripts]
crlb = "crlb.cli:main"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "crlb-web",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.uv.workspace]
members = ["web"]

[tool.uv.sources]
crlb-web = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "web/tests"]
DJANGO_SETTINGS_MODULE = "crlb_web.settings"

[tool.ruff]
extend-exclude = ["scripts/archive", "web/src/crlb_web/validation/migrations"]

[tool.ty.src]
exclude = ["scripts/archive"]
