[project]
name = "crlb"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.28.2",
    "rapidfuzz>=3.14.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.pytest.ini_options]
pythonpath = ["scripts/OCR"]
testpaths = ["tests"]

[tool.ruff]
src = ["scripts/OCR", "tests"]

[tool.ty.environment]
extra-paths = ["scripts/OCR"]
