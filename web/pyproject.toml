[project]
name = "crlb-web"
version = "0.1.0"
description = "Validation interface for the results of the crlb pipeline"
requires-python = ">=3.14"
dependencies = [
    "crlb",
    "django>=6.1.3,<6.2",
]

[project.scripts]
crlb-web = "crlb_web.manage:main"

[tool.uv.sources]
crlb = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"
