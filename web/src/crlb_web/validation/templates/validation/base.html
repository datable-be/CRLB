{% load static %}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}CRLB validation{% endblock %}</title>
<link rel="stylesheet" href="{% static 'validation/review.css' %}"></head><body>
<nav class="top"><a href="{% url 'entries' %}">CRLB validation</a>
{% if user.is_authenticated %}<span class="user">{{ user.get_username }}{% if user.is_staff %} · <a href="{% url 'admin:index' %}">admin</a>{% endif %}
<form method="post" action="{% url 'logout' %}" class="inline">{% csrf_token %}<button type="submit" class="link">log out</button></form></span>{% endif %}
</nav>
{% block content %}{% endblock %}
<script src="{% static 'validation/review.js' %}"></script>
</body></html>
