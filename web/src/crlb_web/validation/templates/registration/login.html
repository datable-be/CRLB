{% extends "validation/base.html" %}
{% block title %}Log in · CRLB validation{% endblock %}
{% block content %}<main class="narrow"><h1>Log in</h1>
{% if form.errors %}<p class="error">The user name and password do not match.</p>{% endif %}
<form method="post">{% csrf_token %}{{ form.as_p }}<input type="hidden" name="next" value="{{ next }}"><button type="submit">Log in</button></form>
</main>{% endblock %}
